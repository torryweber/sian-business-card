<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#07111f"
    >

    <meta
        name="description"
        content="Goh Chun Sian - Sales Manager, Aik Huat Hardware"
    >

    <!-- =====================================
         SOCIAL SHARE PREVIEW
    ====================================== -->

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:title"
        content="Goh Chun Sian | Sales Manager"
    >

    <meta
        property="og:description"
        content="Aik Huat Hardware Digital Business Card"
    >

    <meta
        property="og:image"
        content="share-contact.png"
    >

    <meta
        property="og:url"
        content="https://torryweber.github.io/sian-business-card/"
    >

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="Goh Chun Sian | Sales Manager"
    >

    <meta
        name="twitter:description"
        content="Aik Huat Hardware Digital Business Card"
    >

    <meta
        name="twitter:image"
        content="share-contact.png"
    >


    <!-- =====================================
         TITLE
    ====================================== -->

    <title>
        Goh Chun Sian | Aik Huat Hardware
    </title>


    <!-- =====================================
         FAVICON
    ====================================== -->

    <link
        rel="icon"
        href="favicon.svg"
        type="image/svg+xml"
    >


    <!-- =====================================
         PWA
    ====================================== -->

    <link
        rel="manifest"
        href="manifest.json"
    >


    <!-- =====================================
         CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================
         BACKGROUND GLOW
    ====================================== -->

    <div class="background-glow glow-blue"></div>

    <div class="background-glow glow-yellow"></div>


    <!-- =====================================
         MOVING BACKGROUND WAVES
    ====================================== -->

    <div class="wave wave-blue"></div>

    <div class="wave wave-blue-soft"></div>

    <div class="wave wave-yellow"></div>


    <!-- =====================================
         MAIN PAGE
    ====================================== -->

    <main class="page">

        <section class="card">


            <!-- =================================
                 TOP BAR
            ================================== -->

            <header class="topbar">


                <!-- AIK HUAT LOGO -->

                <div class="logo-container">

                    <img
                        src="aik-huat-logo.png"
                        alt="Aik Huat Hardware"
                        class="logo"
                    >

                </div>


                <!-- SHARE -->

                <button
                    class="share-button"
                    id="shareButton"
                    type="button"
                    aria-label="Share digital business card"
                >

                    <svg
                        class="share-svg"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M12 16V4"
                        />

                        <path
                            d="M7.5 8.5L12 4l4.5 4.5"
                        />

                        <path
                            d="M5 12v6.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V12"
                        />

                    </svg>

                    <span>
                        Share
                    </span>

                </button>

            </header>


            <!-- =================================
                 PROFILE
            ================================== -->

            <section class="profile">


                <div class="profile-ring">

                    <img
                        src="sian-profile.png"
                        alt="Goh Chun Sian"
                        class="profile-photo"
                    >

                </div>


                <div class="company-label">
                    AIK HUAT HARDWARE
                </div>


                <h1>
                    Goh Chun Sian
                </h1>


                <p class="job-title">
                    Sales Manager
                </p>


            </section>


            <!-- =================================
                 SAVE CONTACT
            ================================== -->

            <button
                class="save-contact-button"
                id="saveContactButton"
                type="button"
            >

                <span class="contact-main-icon">

                    <!-- Apple / iPhone CONTACT + -->

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <circle
                            cx="9"
                            cy="8"
                            r="3"
                        />

                        <path
                            d="M3.5 19c.7-3 2.5-4.5 5.5-4.5s4.8 1.5 5.5 4.5"
                        />

                        <path
                            d="M18 11v6"
                        />

                        <path
                            d="M15 14h6"
                        />

                    </svg>

                </span>


                <span>
                    Save Contact
                </span>

            </button>


            <!-- =================================
                 CONTACT BUTTONS
            ================================== -->

            <section class="contact-row">


                <!-- =================================
                     CALL
                ================================== -->

                <a
                    href="tel:+60102907356"
                    class="contact-button"
                >

                    <span class="contact-icon call-icon">

                        <!-- iPhone-style telephone -->

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M6.62 10.79
                                a15.05 15.05 0 0 0 6.59 6.59
                                l2.2-2.2
                                a1 1 0 0 1 1.02-.24
                                c1.12.37 2.33.57 3.57.57
                                a1 1 0 0 1 1 1V20
                                a1 1 0 0 1-1 1
                                C10.61 21 3 13.39 3 4
                                a1 1 0 0 1 1-1h3.5
                                a1 1 0 0 1 1 1
                                c0 1.24.2 2.45.57 3.57
                                a1 1 0 0 1-.24 1.02z"
                            />

                        </svg>

                    </span>


                    <span>
                        Call
                    </span>

                </a>


                <!-- =================================
                     WHATSAPP
                ================================== -->

                <a
                    href="https://wa.me/60102907356"
                    target="_blank"
                    rel="noopener"
                    class="contact-button whatsapp"
                >

                    <span class="contact-icon whatsapp-icon">

                        <!-- WhatsApp logo -->

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                class="whatsapp-bg"
                                d="M12 2.25
                                a9.75 9.75 0 0 0-8.4 14.7
                                L2.35 21.7
                                l4.9-1.2
                                A9.75 9.75 0 1 0 12 2.25z"
                            />

                            <path
                                class="whatsapp-phone"
                                d="M8.15 7.35
                                c.28-.3.7-.38 1.07-.19
                                l1.22.62
                                c.36.18.53.6.39.98
                                l-.48 1.27
                                c.62 1.25 1.62 2.25 2.87 2.87
                                l1.27-.48
                                c.38-.14.8.03.98.39
                                l.62 1.22
                                c.19.37.11.79-.19 1.07
                                l-.63.63
                                c-.5.5-1.23.68-1.9.47
                                -3.48-1.08-6.22-3.82-7.3-7.3
                                -.21-.67-.03-1.4.47-1.9z"
                            />

                        </svg>

                    </span>


                    <span>
                        WhatsApp
                    </span>

                </a>


                <!-- =================================
                     EMAIL
                ================================== -->

                <a
                    href="mailto:gcs@aikhuathardware.com"
                    class="contact-button"
                >

                    <span class="contact-icon email-icon">

                        <!-- Apple-style Mail -->

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="3"
                            />

                            <path
                                d="M4.5 7l7.5 6 7.5-6"
                            />

                        </svg>

                    </span>


                    <span>
                        Email
                    </span>

                </a>


            </section>


            <!-- =================================
                 LOCATIONS
            ================================== -->

            <section class="locations">


                <div class="section-title">
                    Locations
                </div>


                <!-- HQ SERI KEMBANGAN -->

                <a
                    href="https://maps.app.goo.gl/YtwHbW3f7R9LehJt6?g_st=ic"
                    target="_blank"
                    rel="noopener"
                    class="map-button"
                >

                    <div class="map-icon">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"
                            />

                            <circle
                                cx="12"
                                cy="9.5"
                                r="2.3"
                            />

                        </svg>

                    </div>


                    <div class="map-text">

                        <strong>
                            HQ Seri Kembangan
                        </strong>

                        <small>
                            Open in Google Maps
                        </small>

                    </div>


                    <div class="map-arrow">
                        ›
                    </div>

                </a>


                <!-- HQ OFFICE -->

                <a
                    href="https://maps.app.goo.gl/K6HfArwTtnpaTYvb9?g_st=ic"
                    target="_blank"
                    rel="noopener"
                    class="map-button"
                >

                    <div class="map-icon">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"
                            />

                            <circle
                                cx="12"
                                cy="9.5"
                                r="2.3"
                            />

                        </svg>

                    </div>


                    <div class="map-text">

                        <strong>
                            HQ Office
                        </strong>

                        <small>
                            Open in Google Maps
                        </small>

                    </div>


                    <div class="map-arrow">
                        ›
                    </div>

                </a>


            </section>


            <!-- =================================
                 WEBSITE
            ================================== -->

            <a
                href="https://aikhuathardware.com/"
                target="_blank"
                rel="noopener"
                class="website-button"
            >

                <span class="website-icon">

                    <!-- Safari-style Website icon -->

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <circle
                            cx="12"
                            cy="12"
                            r="9"
                        />

                        <path
                            d="M15.5 8.5l-2.2 4.8-4.8 2.2 2.2-4.8z"
                        />

                    </svg>

                </span>


                <span>
                    Aik Huat Website
                </span>


                <span class="website-arrow">
                    ›
                </span>

            </a>


            <!-- =================================
                 FOOTER
            ================================== -->

            <footer>

                <p>
                    Tap NFC to open this digital card
                </p>

            </footer>


        </section>

    </main>


    <!-- =====================================
         TOAST
    ====================================== -->

    <div
        class="toast"
        id="toast"
    ></div>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="script.js"></script>


</body>

</html>
