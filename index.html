<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#07111f"
    >

    <meta
        name="description"
        content="Goh Chun Sian - Sales Manager, Aik Huat Hardware"
    >


    <!-- =====================================
         SHARE PREVIEW
    ====================================== -->

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:title"
        content="Goh Chun Sian | Sales Manager"
    >

    <meta
        property="og:description"
        content="Aik Huat Hardware Digital Business Card"
    >

    <meta
        property="og:image"
        content="share-contact.png"
    >

    <meta
        property="og:url"
        content="https://torryweber.github.io/sian-business-card/"
    >


    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="Goh Chun Sian | Sales Manager"
    >

    <meta
        name="twitter:description"
        content="Aik Huat Hardware Digital Business Card"
    >

    <meta
        name="twitter:image"
        content="share-contact.png"
    >


    <title>
        Goh Chun Sian | Aik Huat Hardware
    </title>


    <!-- =====================================
         FAVICON
    ====================================== -->

    <link
        rel="icon"
        href="favicon.svg"
        type="image/svg+xml"
    >


    <!-- =====================================
         PWA
    ====================================== -->

    <link
        rel="manifest"
        href="manifest.json"
    >


    <!-- =====================================
         CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================
         BACKGROUND
    ====================================== -->

    <div class="background-glow glow-blue"></div>

    <div class="background-glow glow-yellow"></div>


    <!-- =====================================
         ANIMATED WAVES
    ====================================== -->

    <div class="wave wave-blue"></div>

    <div class="wave wave-blue-soft"></div>

    <div class="wave wave-yellow"></div>


    <!-- =====================================
         MAIN PAGE
    ====================================== -->

    <main class="page">

        <section class="card">


            <!-- =================================
                 TOP BAR
            ================================== -->

            <header class="topbar">


                <!-- LOGO -->

                <div class="logo-container">

                    <img
                        src="aik-huat-logo.png"
                        alt="Aik Huat Hardware"
                        class="logo"
                    >

                </div>


                <!-- SHARE -->

                <button
                    class="share-button"
                    id="shareButton"
                    type="button"
                    aria-label="Share digital business card"
                >

                    <!-- iPhone-style Share SVG -->

                    <svg
                        class="share-svg"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M12 16V4"
                        />

                        <path
                            d="M7.5 8.5L12 4l4.5 4.5"
                        />

                        <path
                            d="M5 12v6.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V12"
                        />

                    </svg>

                    <span>
                        Share
                    </span>

                </button>


            </header>


            <!-- =================================
                 PROFILE
            ================================== -->

            <section class="profile">


                <div class="profile-ring">

                    <img
                        src="sian-profile.png"
                        alt="Goh Chun Sian"
                        class="profile-photo"
                    >

                </div>


                <div class="company-label">
                    AIK HUAT HARDWARE
                </div>


                <h1>
                    Goh Chun Sian
                </h1>


                <p class="job-title">
                    Sales Manager
                </p>


            </section>


            <!-- =================================
                 SAVE CONTACT
            ================================== -->

            <button
                class="save-contact-button"
                id="saveContactButton"
                type="button"
            >

                <span class="button-icon contact-main-icon">

                    <!-- Apple-style Contact + -->

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <circle
                            cx="9"
                            cy="8"
                            r="3"
                        />

                        <path
                            d="M3.5 19c.7-3 2.5-4.5 5.5-4.5s4.8 1.5 5.5 4.5"
                        />

                        <path
                            d="M18 11v6"
                        />

                        <path
                            d="M15 14h6"
                        />

                    </svg>

                </span>

                <span>
                    Save Contact
                </span>

            </button>


            <!-- =================================
                 CALL / WHATSAPP / EMAIL
            ================================== -->

            <section class="contact-row">


                <!-- CALL -->

                <a
                    href="tel:+60102907356"
                    class="contact-button"
                >

                    <span class="contact-icon">

                        <!-- iPhone Phone -->

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M6.5 3.5l3 1.5-1.4 3.2a14.8 14.8 0 0 0 7.7 7.7l3.2-1.4 1.5 3c.4.8.1 1.8-.7 2.1-1.1.4-1.4.6-2.8.4-4.3C19.3 8.2 15.8 4.7 8.7 3.8c-1.5-.2-2.9 0-4.3.4-.8.3-1.1 1.3-.7 2.1z"
                            />

                        </svg>

                    </span>

                    <span>
                        Call
                    </span>

                </a>


                <!-- WHATSAPP -->

                <a
                    href="https://wa.me/60102907356"
                    target="_blank"
                    rel="noopener"
                    class="contact-button whatsapp"
                >

                    <span class="contact-icon whatsapp-icon">

                        <!-- WhatsApp Logo -->

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                class="whatsapp-circle"
                                d="M12 2.5a9.5 9.5 0 0 0-8.2 14.3L2.7 21.5l4.8-1.1A9.5 9.5 0 1 0 12 2.5z"
                            />

                            <path
                                class="whatsapp-phone"
                                d="M8.2 7.7c.2-.3.5-.4.8-.2l1.2.6c.3.2.4.5.3.8l-.5 1a7.2 7.2 0 0 0 3.2 3.2l1-.5c.3-.1.6 0 .8.3l.6 1.2c.2.3.1.6-.2.8-.5.5-1.2.7-1.8.5-3.8-1.1-6.4-3.7-7.5-7.5-.2-.6 0-1.3.5-1.8z"
                            />

                        </svg>

                    </span>

                    <span>
                        WhatsApp
                    </span>

                </a>


                <!-- EMAIL -->

                <a
                    href="mailto:gcs@aikhuathardware.com"
                    class="contact-button"
                >

                    <span class="contact-icon">

                        <!-- Apple Mail -->

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="3"
                            />

                            <path
                                d="M4.5 7l7.5 6 7.5-6"
                            />

                        </svg>

                    </span>

                    <span>
                        Email
                    </span>

                </a>


            </section>


            <!-- =================================
                 LOCATIONS
            ================================== -->

            <section class="locations">


                <div class="section-title">
                    Locations
                </div>


                <!-- HQ SERI KEMBANGAN -->

                <a
                    href="https://maps.app.goo.gl/YtwHbW3f7R9LehJt6?g_st=ic"
                    target="_blank"
                    rel="noopener"
                    class="map-button"
                >

                    <div class="map-icon">

                        <!-- Apple-style Map Pin -->

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"
                            />

                            <circle
                                cx="12"
                                cy="9.5"
                                r="2.3"
                            />

                        </svg>

                    </div>


                    <div class="map-text">

                        <strong>
                            HQ Seri Kembangan
                        </strong>

                        <small>
                            Open in Google Maps
                        </small>

                    </div>


                    <div class="map-arrow">
                        ›
                    </div>

                </a>


                <!-- HQ OFFICE -->

                <a
                    href="https://maps.app.goo.gl/K6HfArwTtnpaTYvb9?g_st=ic"
                    target="_blank"
                    rel="noopener"
                    class="map-button"
                >

                    <div class="map-icon">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"
                            />

                            <circle
                                cx="12"
                                cy="9.5"
                                r="2.3"
                            />

                        </svg>

                    </div>


                    <div class="map-text">

                        <strong>
                            HQ Office
                        </strong>

                        <small>
                            Open in Google Maps
                        </small>

                    </div>


                    <div class="map-arrow">
                        ›
                    </div>

                </a>


            </section>


            <!-- =================================
                 WEBSITE
            ================================== -->

            <a
                href="https://aikhuathardware.com/"
                target="_blank"
                rel="noopener"
                class="website-button"
            >

                <span class="website-icon">

                    <!-- Safari / Web -->

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <circle
                            cx="12"
                            cy="12"
                            r="9"
                        />

                        <path
                            d="M15.5 8.5l-2.2 4.8-4.8 2.2 2.2-4.8z"
                        />

                    </svg>

                </span>

                <span>
                    Aik Huat Website
                </span>

                <span class="website-arrow">
                    ›
                </span>

            </a>


            <!-- =================================
                 FOOTER
            ================================== -->

            <footer>

                <p>
                    Tap NFC to open this digital card
                </p>

            </footer>


        </section>

    </main>


    <!-- =====================================
         TOAST
    ====================================== -->

    <div
        class="toast"
        id="toast"
    ></div>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="script.js"></script>

</body>

</html>
