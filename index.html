<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#07111f"
    >

    <meta
        name="description"
        content="Goh Chun Sian - Sales Manager, Aik Huat Hardware"
    >

    <!-- =========================================
         SOCIAL SHARE
    ========================================== -->

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:title"
        content="Goh Chun Sian | Sales Manager"
    >

    <meta
        property="og:description"
        content="Aik Huat Hardware Digital Business Card"
    >

    <meta
        property="og:image"
        content="share-contact.png"
    >

    <meta
        property="og:url"
        content="https://torryweber.github.io/sian-business-card/"
    >

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="Goh Chun Sian | Sales Manager"
    >

    <meta
        name="twitter:description"
        content="Aik Huat Hardware Digital Business Card"
    >

    <meta
        name="twitter:image"
        content="share-contact.png"
    >


    <!-- =========================================
         TITLE
    ========================================== -->

    <title>
        Goh Chun Sian | Aik Huat Hardware
    </title>


    <!-- =========================================
         FAVICON
    ========================================== -->

    <link
        rel="icon"
        href="favicon.svg"
        type="image/svg+xml"
    >


    <!-- =========================================
         PWA
    ========================================== -->

    <link
        rel="manifest"
        href="manifest.json"
    >


    <!-- =========================================
         CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================================
         BACKGROUND
    ========================================== -->

    <div class="background-glow glow-blue"></div>

    <div class="background-glow glow-yellow"></div>

    <div class="wave wave-blue"></div>

    <div class="wave wave-blue-soft"></div>

    <div class="wave wave-yellow"></div>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="page">

        <section class="card">


            <!-- =====================================
                 TOP BAR
            ====================================== -->

            <header class="topbar">

                <div class="logo-container">

                    <img
                        src="aik-huat-logo.png"
                        alt="Aik Huat Hardware"
                        class="logo"
                    >

                </div>


                <button
                    class="share-button"
                    id="shareButton"
                    type="button"
                >

                    <svg
                        class="share-svg"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path d="M12 16V4"></path>

                        <path d="M7.5 8.5L12 4l4.5 4.5"></path>

                        <path d="M5 12v6.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V12"></path>

                    </svg>

                    <span>
                        Share
                    </span>

                </button>

            </header>


            <!-- =====================================
                 PROFILE
            ====================================== -->

            <section class="profile">

                <div class="profile-ring">

                    <img
                        src="sian-profile.png"
                        alt="Goh Chun Sian"
                        class="profile-photo"
                    >

                </div>


                <div class="company-label">
                    AIK HUAT HARDWARE
                </div>


                <h1>
                    Goh Chun Sian
                </h1>


                <p class="job-title">
                    Sales Manager
                </p>

            </section>


            <!-- =====================================
                 SAVE CONTACT
            ====================================== -->

            <button
                class="save-contact-button"
                id="saveContactButton"
                type="button"
            >

                <span class="contact-main-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <circle
                            cx="9"
                            cy="8"
                            r="3"
                        ></circle>

                        <path
                            d="M3.5 19c.7-3 2.5-4.5 5.5-4.5s4.8 1.5 5.5 4.5"
                        ></path>

                        <path
                            d="M18 11v6"
                        ></path>

                        <path
                            d="M15 14h6"
                        ></path>

                    </svg>

                </span>


                <span>
                    Save Contact
                </span>

            </button>


            <!-- =====================================
                 CONTACT BUTTONS
            ====================================== -->

            <section class="contact-row">


                <!-- =================================
                     CALL
                ================================== -->

                <a
                    href="tel:+60102907356"
                    class="contact-button"
                >

                    <span class="contact-icon call-icon">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M6.62 10.79
                                a15.05 15.05 0 0 0 6.59 6.59
                                l2.2-2.2
                                a1 1 0 0 1 1.02-.24
                                c1.12.37 2.33.57 3.57.57
                                a1 1 0 0 1 1 1V20
                                a1 1 0 0 1-1 1
                                C10.61 21 3 13.39 3 4
                                a1 1 0 0 1 1-1h3.5
                                a1 1 0 0 1 1 1
                                c0 1.24.2 2.45.57 3.57
                                a1 1 0 0 1-.24 1.02z"
                            ></path>

                        </svg>

                    </span>

                    <span>
                        Call
                    </span>

                </a>


                <!-- =================================
                     WHATSAPP
                ================================== -->

                <a
                    href="https://wa.me/60102907356"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="contact-button"
                >

                    <span class="contact-icon whatsapp-icon">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <!-- SOLID GREEN WHATSAPP CIRCLE -->

                            <circle
                                cx="12"
                                cy="12"
                                r="9.5"
                                class="wa-green"
                            ></circle>


                            <!-- SMALL CHAT TAIL -->

                            <path
                                class="wa-green"
                                d="M5.2 17.5L4.2 20l2.8-.8z"
                            ></path>


                            <!-- WHITE HANDSET -->

                            <path
                                class="wa-white"
                                d="M8.2 7.6
                                c.25-.3.7-.37 1.05-.17
                                l1.18.65
                                c.35.19.5.6.37.98
                                l-.43 1.18
                                c.56 1.12 1.48 2.04 2.6 2.6
                                l1.18-.43
                                c.38-.13.79.02.98.37
                                l.65 1.18
                                c.2.35.13.8-.17 1.05
                                l-.5.5
                                c-.46.46-1.14.63-1.77.44
                                -3.32-.99-5.95-3.62-6.94-6.94
                                -.19-.63-.02-1.31.44-1.77z"
                            ></path>

                        </svg>

                    </span>

                    <span>
                        WhatsApp
                    </span>

                </a>


                <!-- =================================
                     EMAIL
                ================================== -->

                <a
                    href="mailto:gcs@aikhuathardware.com"
                    class="contact-button"
                >

                    <span class="contact-icon email-icon">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="3"
                            ></rect>

                            <path
                                d="M4.5 7l7.5 6 7.5-6"
                            ></path>

                        </svg>

                    </span>

                    <span>
                        Email
                    </span>

                </a>

            </section>


            <!-- =====================================
                 LOCATIONS
            ====================================== -->

            <section class="locations">

                <div class="section-title">
                    Locations
                </div>


                <!-- HQ SERI KEMBANGAN -->

                <a
                    href="https://maps.app.goo.gl/YtwHbW3f7R9LehJt6?g_st=ic"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="map-button"
                >

                    <div class="map-icon">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"
                            ></path>

                            <circle
                                cx="12"
                                cy="9.5"
                                r="2.3"
                            ></circle>

                        </svg>

                    </div>


                    <div class="map-text">

                        <strong>
                            HQ Seri Kembangan
                        </strong>

                        <small>
                            Open in Google Maps
                        </small>

                    </div>


                    <div class="map-arrow">
                        ›
                    </div>

                </a>


                <!-- HQ OFFICE -->

                <a
                    href="https://maps.app.goo.gl/K6HfArwTtnpaTYvb9?g_st=ic"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="map-button"
                >

                    <div class="map-icon">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"
                            ></path>

                            <circle
                                cx="12"
                                cy="9.5"
                                r="2.3"
                            ></circle>

                        </svg>

                    </div>


                    <div class="map-text">

                        <strong>
                            HQ Office
                        </strong>

                        <small>
                            Open in Google Maps
                        </small>

                    </div>


                    <div class="map-arrow">
                        ›
                    </div>

                </a>

            </section>


            <!-- =====================================
                 WEBSITE
            ====================================== -->

            <a
                href="https://aikhuathardware.com/"
                target="_blank"
                rel="noopener noreferrer"
                class="website-button"
            >

                <span class="website-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <circle
                            cx="12"
                            cy="12"
                            r="9"
                        ></circle>

                        <path
                            d="M15.5 8.5l-2.2 4.8-4.8 2.2 2.2-4.8z"
                        ></path>

                    </svg>

                </span>


                <span>
                    Aik Huat Website
                </span>


                <span class="website-arrow">
                    ›
                </span>

            </a>


            <!-- =====================================
                 FOOTER
            ====================================== -->

            <footer>

                <p>
                    Tap NFC to open this digital card
                </p>

            </footer>


        </section>

    </main>


    <!-- =====================================
         TOAST
    ====================================== -->

    <div
        class="toast"
        id="toast"
    ></div>


    <!-- =====================================
         SCRIPT
    ====================================== -->

    <script src="script.js"></script>


</body>

</html>
