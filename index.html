<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#07111f"
    >

    <meta
        name="description"
        content="Goh Chun Sian - Sales Manager, Aik Huat Hardware"
    >


    <!-- =====================================
         SHARE PREVIEW
    ====================================== -->

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:title"
        content="Goh Chun Sian | Sales Manager"
    >

    <meta
        property="og:description"
        content="Aik Huat Hardware Digital Business Card"
    >

    <meta
        property="og:image"
        content="share-contact.png"
    >

    <meta
        property="og:url"
        content="https://torryweber.github.io/sian-business-card/"
    >


    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="Goh Chun Sian | Sales Manager"
    >

    <meta
        name="twitter:description"
        content="Aik Huat Hardware Digital Business Card"
    >

    <meta
        name="twitter:image"
        content="share-contact.png"
    >


    <!-- =====================================
         TITLE
    ====================================== -->

    <title>
        Goh Chun Sian | Aik Huat Hardware
    </title>


    <!-- =====================================
         FAVICON
    ====================================== -->

    <link
        rel="icon"
        href="favicon.svg"
        type="image/svg+xml"
    >


    <!-- =====================================
         PWA
    ====================================== -->

    <link
        rel="manifest"
        href="manifest.json"
    >


    <!-- =====================================
         CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================
         BACKGROUND
    ====================================== -->

    <div class="background-glow glow-blue"></div>

    <div class="background-glow glow-yellow"></div>


    <!-- =====================================
         MAIN PAGE
    ====================================== -->

    <main class="page">

        <section class="card">


            <!-- =================================
                 TOP BAR
            ================================== -->

            <header class="topbar">


                <div class="logo-container">

                    <img
                        src="aik-huat-logo.png"
                        alt="Aik Huat Hardware"
                        class="logo"
                    >

                </div>


                <!-- SHARE -->

                <button
                    class="share-button"
                    id="shareButton"
                    type="button"
                    aria-label="Share digital business card"
                >

                    <span class="share-icon">
                        ↗
                    </span>

                    <span>
                        Share
                    </span>

                </button>


            </header>


            <!-- =================================
                 PROFILE
            ================================== -->

            <section class="profile">


                <div class="profile-ring">

                    <img
                        src="sian-profile.png"
                        alt="Goh Chun Sian"
                        class="profile-photo"
                    >

                </div>


                <div class="company-label">
                    AIK HUAT HARDWARE
                </div>


                <h1>
                    Goh Chun Sian
                </h1>


                <p class="job-title">
                    Sales Manager
                </p>


            </section>


            <!-- =================================
                 SAVE CONTACT
            ================================== -->

            <button
                class="save-contact-button"
                id="saveContactButton"
                type="button"
            >

                <span class="button-icon">
                    ＋
                </span>

                <span>
                    Save Contact
                </span>

            </button>


            <!-- =================================
                 CALL / WHATSAPP / EMAIL
            ================================== -->

            <section class="contact-row">


                <a
                    href="tel:+60102907356"
                    class="contact-button"
                >

                    <span class="contact-icon">
                        ☎
                    </span>

                    <span>
                        Call
                    </span>

                </a>


                <a
                    href="https://wa.me/60102907356"
                    target="_blank"
                    rel="noopener"
                    class="contact-button whatsapp"
                >

                    <span class="contact-icon">
                        ◉
                    </span>

                    <span>
                        WhatsApp
                    </span>

                </a>


                <a
                    href="mailto:gcs@aikhuathardware.com"
                    class="contact-button"
                >

                    <span class="contact-icon">
                        ✉
                    </span>

                    <span>
                        Email
                    </span>

                </a>


            </section>


            <!-- =================================
                 LOCATIONS
            ================================== -->

            <section class="locations">


                <div class="section-title">
                    Locations
                </div>


                <a
                    href="https://maps.app.goo.gl/YtwHbW3f7R9LehJt6?g_st=ic"
                    target="_blank"
                    rel="noopener"
                    class="map-button"
                >

                    <div class="map-icon">
                        ⌖
                    </div>

                    <div class="map-text">

                        <strong>
                            HQ Seri Kembangan
                        </strong>

                        <small>
                            Open in Google Maps
                        </small>

                    </div>

                    <div class="map-arrow">
                        ›
                    </div>

                </a>


                <a
                    href="https://maps.app.goo.gl/K6HfArwTtnpaTYvb9?g_st=ic"
                    target="_blank"
                    rel="noopener"
                    class="map-button"
                >

                    <div class="map-icon">
                        ⌖
                    </div>

                    <div class="map-text">

                        <strong>
                            HQ Office
                        </strong>

                        <small>
                            Open in Google Maps
                        </small>

                    </div>

                    <div class="map-arrow">
                        ›
                    </div>

                </a>


            </section>


            <!-- =================================
                 WEBSITE
            ================================== -->

            <a
                href="https://aikhuathardware.com/"
                target="_blank"
                rel="noopener"
                class="website-button"
            >

                <span class="website-icon">
                    ◉
                </span>

                <span>
                    Aik Huat Website
                </span>

                <span class="website-arrow">
                    ›
                </span>

            </a>


            <!-- =================================
                 FOOTER
            ================================== -->

            <footer>

                <p>
                    Tap NFC to open this digital card
                </p>

            </footer>


        </section>

    </main>


    <!-- =====================================
         TOAST
    ====================================== -->

    <div
        class="toast"
        id="toast"
    ></div>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="script.js"></script>

</body>

</html>
